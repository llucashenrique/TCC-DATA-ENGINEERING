dag_id: dag_transform_gold_metrics

description: |
  DAG responsável pela construção das métricas agregadas
  da camada gold a partir das tabelas fato utilizando Spark.

tags:
  - spark
  - transformation
  - olist
  - gold
  - metrics

schedule_interval: "@once"
start_date: 2026-01-01T00:00:00
catchup: false

default_args:
  retries: 1
  retry_delay: 300

tasks:

  - task_id: start
    operator: airflow.operators.empty.EmptyOperator

  - task_id: build_metrics
    operator: airflow.providers.apache.spark.operators.spark_submit.SparkSubmitOperator
    dependencies:
      - start
    params:
      application: /opt/spark/work-dir/src/spark/jobs/transform/spark_job_transform_gold_metrics.py
      conn_id: spark_default
      conf:
        spark.master: "spark://spark-master:7077"
      jars: /opt/spark/jars/hadoop-aws-3.3.4.jar,/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar,/opt/spark/jars/postgresql-42.6.0.jar
      application_args:
        - "--from-bucket"
        - "gold"
        - "--to-bucket"
        - "gold"

  - task_id: end
    operator: airflow.operators.empty.EmptyOperator
    dependencies:
      - build_metrics