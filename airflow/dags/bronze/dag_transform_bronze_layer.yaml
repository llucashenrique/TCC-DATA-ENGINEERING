dag_id: dag_transform_bronze_layer

description: |
  DAG responsável pelo processamento do dataset Olist
  utilizando Spark.
tags:
  - spark
  - transformation
  - olist

schedule_interval: "@once"
start_date: 2026-01-01T00:00:00
catchup: false
default_args:
  retries: 1
  retry_delay: 300
 
tasks:

  - task_id: start
    operator: airflow.operators.empty.EmptyOperator

  - task_id: ingest_orders
    operator: airflow.providers.apache.spark.operators.spark_submit.SparkSubmitOperator
    dependencies: 
      - start
    params:
      application: /opt/spark/work-dir/src/spark/jobs/spark_job_transform_bronze_layer.py
      conn_id: spark_default
      application_args:
        - "--from-bucket"
        - "raw-zone"
        - "--to-bucket"
        - "bronze-zone"
        - "--data-relative-path"
        - "olist/orders/2026/03/orders.csv"

  - task_id: ingest_customers
    operator: airflow.providers.apache.spark.operators.spark_submit.SparkSubmitOperator
    dependencies: 
       - start
    params:
      application: /opt/spark/work-dir/src/spark/jobs/spark_job_transform_bronze_layer.py
      conn_id: spark_default
      application_args:
        - "--from-bucket"
        - "raw-zone"
        - "--to-bucket"
        - "bronze-zone"
        - "--data-relative-path"
        - "olist/customers/2026/03/customers.csv"

  - task_id: ingest_products
    operator: airflow.providers.apache.spark.operators.spark_submit.SparkSubmitOperator
    dependencies: 
       - start
    params:
      application: /opt/spark/work-dir/src/spark/jobs/spark_job_transform_bronze_layer.py
      conn_id: spark_default
      application_args:
        - "--from-bucket"
        - "raw-zone"
        - "--to-bucket"
        - "bronze-zone"
        - "--data-relative-path"
        - "olist/products/2026/03/products.csv"
        
  - task_id: end
    operator: airflow.operators.empty.EmptyOperator
    dependencies:
      - ingest_orders
      - ingest_customers
      - ingest_products