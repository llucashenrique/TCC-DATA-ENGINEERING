dag_id: process_olist

description: |
  DAG responsável pelo processamento do dataset Olist
  utilizando Spark.
tags:
  - spark
  - transformation
  - olist

schedule_interval: "@once"
start_date: 2026-01-01T00:00:00
catchup: false

default_args:
  retries: 1
  retry_delay: 300

tasks:

  - task_id: start_task
    operator: airflow.operators.empty.EmptyOperator

  - task_id: process_orders
    operator: airflow.providers.apache.spark.operators.spark_submit.SparkSubmitOperator
    dependencies:
      - start
    params:
      application: /opt/spark/jobs/process_olist_dataset.py
      conn_id: spark_default

      application_args:
        - "--from-bucket"
        - "raw"

        - "--to-bucket"
        - "curated"

        - "--data-relative-path"
        - "olist/olist_orders_dataset.csv"

  - task_id: end_task
    operator: airflow.operators.empty.EmptyOperator
    dependencies:
      - process_orders