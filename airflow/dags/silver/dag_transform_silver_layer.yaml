dag_id: dag_transform_silver_layer

description: |
  DAG responsável pela transformação dos datasets Olist
  da camada bronze para silver utilizando Spark.

tags:
  - spark
  - transformation
  - olist
  - silver

schedule_interval: "@once"
start_date: 2026-01-01T00:00:00
catchup: false

default_args:
  retries: 1
  retry_delay: 300

doc_md: |
  ### DAG para transformação dos arquivos da Bronze para camada Silver.

tasks:

  - task_id: start
    operator: airflow.operators.empty.EmptyOperator

  - task_id: ingest_orders
    operator: airflow.providers.apache.spark.operators.spark_submit.SparkSubmitOperator
    dependencies:
      - start
    params:
      application: /opt/spark/work-dir/src/spark/jobs/transform/spark_job_transform_silver_layer.py
      conn_id: spark_default
      conf:
        spark.master: "spark://spark-master:7077"
      jars: /opt/spark/jars/hadoop-aws-3.3.4.jar,/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar
      application_args:
        - "--from-bucket"
        - "bronze"
        - "--to-bucket"
        - "silver"
        - "--dataset-name"
        - "olist_orders_dataset"

  - task_id: ingest_customers
    operator: airflow.providers.apache.spark.operators.spark_submit.SparkSubmitOperator
    dependencies:
      - start
    params:
