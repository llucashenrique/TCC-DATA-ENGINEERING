dag_id: ingest_olist
description: |
  DAG responsável pela ingestão do dataset Olist
  a partir do Kaggle para a camada RAW no MinIO.
tags:
  - ingestion
  - olist
  - kaggle

schedule_interval: "@once"
start_date: 2026-01-01T00:00:00
catchup: false

default_args:
  retries: 1
  retry_delay: 300
  depends_on_past: false

doc_md:
  ### TODO

tasks:

  - task_id: start_task
    operator: airflow.operators.empty.EmptyOperator
    params:
      trigger_rule: all_success

  - task_id: download_dataset_olist
    operator: airflow.operators.python.PythonOperator
    dependencies:
      - start_task
    params:
      python_callable: jobs.ingest_raw_olist.run

  - task_id: end_task
    operator: airflow.operators.empty.EmptyOperator
    dependencies:
      - download_dataset_olist
    params:
      trigger_rule: all_success
